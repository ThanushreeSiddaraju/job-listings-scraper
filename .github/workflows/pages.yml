# Publishes docs/ to GitHub Pages with a fresh job-portal snapshot (Naukri, Indeed, LinkedIn, Google Jobs).
# The snapshot is built here, not committed: each run scrapes, then deploys docs/ plus data/portal-jobs.json.
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch the last published snapshot (reused for portals that fail this time)
        run: curl -sfL "https://thanushreesiddaraju.github.io/job-listings-scraper/data/portal-jobs.json" -o previous.json || true

      - name: Scrape job portals
        # A failed scrape shouldn't stop the deploy: fall back to the previous snapshot.
        run: |
          python snapshot.py --config portal_roles.json --out docs/data/portal-jobs.json --previous previous.json \
            || { [ -s previous.json ] && mkdir -p docs/data && cp previous.json docs/data/portal-jobs.json; } || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
